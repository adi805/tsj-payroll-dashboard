name: build-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==5.13.2"

      # Win 7 TANPA KB2999226: DLL Universal C Runtime (ucrtbase.dll +
      # api-ms-win-crt-*.dll) diambil dari Windows SDK Redist
      # (ucrt\DLLs\x64) — runner OS (10.0.26100) TIDAK menyimpan
      # api-ms-win-crt-* di System32 maupun WinSxS. Fallback: WinSxS.
      # Lalu di-bundle ke DALAM exe onefile. Target Win7 zero-install.
      - name: Stage UCRT DLLs (bundling buat Win7, zero-install)
        shell: powershell
        run: |
          $kits = "C:\Program Files (x86)\Windows Kits\10\Redist"
          $candidates = @()
          $candidates += Get-ChildItem $kits -Directory -ErrorAction SilentlyContinue |
                        Sort-Object Name -Descending |
                        ForEach-Object { Join-Path $_.FullName 'ucrt\DLLs\x64' } |
                        Where-Object { Test-Path $_ }
          $ws = Get-ChildItem C:\Windows\WinSxS -Directory -Filter 'amd64_microsoft-windows-ucrt*' -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
          if ($ws) { $candidates += $ws.FullName }
          $srcDir = $candidates | Where-Object { Test-Path (Join-Path $_ 'api-ms-win-crt-*.dll') } | Select-Object -First 1
          if (-not $srcDir) { throw "No UCRT source found (Windows SDK Redist / WinSxS)" }
          Write-Host "UCRT source: $srcDir"
          New-Item -ItemType Directory -Force -Path ucrt | Out-Null
          Copy-Item (Join-Path $srcDir 'ucrtbase.dll') ucrt\ -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $srcDir 'api-ms-win-crt-*.dll') ucrt\ -ErrorAction SilentlyContinue
          $count = (Get-ChildItem ucrt -Filter *.dll).Count
          Write-Host "UCRT DLL staged: $count files"
          if (($count -lt 10) -or -not (Test-Path 'ucrt\ucrtbase.dll')) { throw "UCRT staging failed - too few DLLs ($count)" }

      - name: PyInstaller onefile (UCRT ter-bundle di dalam exe)
        shell: bash
        run: |
          ADD_BIN=()
          for f in ucrt/*.dll; do
            ADD_BIN+=(--add-binary "$f;.")
          done
          pyinstaller --noconfirm --onefile --windowed \
            --name "KitUpahTSJ" \
            --add-data "pipeline_upah.py;." \
            "${ADD_BIN[@]}" \
            app_gui.py
          echo "--- dist ---"
          ls -la dist/

      - name: Package release zip
        shell: bash
        run: |
          python -c "import zipfile, os; z=zipfile.ZipFile('KitUpahTSJ-windows.zip','w',zipfile.ZIP_DEFLATED); z.write('dist/KitUpahTSJ.exe','KitUpahTSJ.exe'); z.close(); print('zip ok:', os.path.getsize('KitUpahTSJ-windows.zip'),'bytes')"
          ls -la KitUpahTSJ-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitUpahTSJ-windows
          path: KitUpahTSJ-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kit Upah TSJ ${{ github.ref_name }}
          body: |
            ## Kit Upah TSJ — Dashboard Payroll

            **Versi:** ${{ github.ref_name }}
            **Target:** Windows 7 SP1 / 10 / 11 (64-bit)
            **Ukuran:** ±12-15 MB (onefile, self-contained)

            ### ✅ v1.0.1 — Perbaikan
            - DLL Universal C Runtime (`ucrtbase.dll` + `api-ms-win-crt-*.dll`) DIBUNDEL **DI DALAM exe** — Windows 7 langsung jalan, TANPA install UCRT KB2999226
            - `Data Upah TSJ ... ASLI-backup.xlsx` kini **OPSIONAL** — pipeline tetap jalan kalau cuma 11 file (cache fallback ke file utama)
            - PyInstaller di-pin ke 5.13.2 (dukungan Win 7 penuh)

            ### Install
            1. Download `KitUpahTSJ-windows.zip` di bawah
            2. Extract ke folder mana saja (mis. `C:\KitUpahTSJ\`)
            3. Double-click `KitUpahTSJ.exe` — selesai, tidak ada install tambahan

            ### Cara Pakai
            1. Isi **Folder closingan** — folder berisi 12 file closing bulanan
            2. (Opsional) Isi **File output** — default `Kit-Upah-TSJ-AUTO.xlsx` di folder parent
            3. Klik **PROSES KIT UPAH** — log realtime, tersimpan ke `logs/run-<timestamp>.log`
            4. Klik **Buka file hasil** untuk membuka Excel
            5. Log toolbar: **SALIN SEMUA LOG**, Pilih Semua, Simpan ke File, Bersihkan

            ### Update Otomatis
            Tools → **Cek Update** → download release baru, close app, replace exe, restart.

            ### Source
            https://github.com/adi805/tsj-payroll-dashboard
          files: |
            KitUpahTSJ-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
